[main]
font=monospace:size=10
dpi-aware=no
terminal=foot -e
prompt="> "
icons-enabled=no
fields=filename,name,generic,keywords
show-actions=no
match-mode=fzf
layer=overlay
anchor=top
y-margin=0
width=60
lines=12
horizontal-pad=10
vertical-pad=8
inner-pad=6
line-height=12
exit-on-keyboard-focus-loss=yes

[colors]
background=323232ff
text=ffffffff
prompt=ffffffff
placeholder=888888ff
input=ffffffff
match=4c7899ff
selection=285577ff
selection-text=ffffffff
selection-match=ffffffff
counter=888888ff
border=4c7899ff

[border]
width=2
radius=0
selection-radius=0
