# The initial color theme is written to theme.ini by ~/.config/sway/darkmode.sh,
# which also switches running windows with a signal.
# (theme.ini is generated; install.sh creates a default one.)
include=~/.config/foot/theme.ini

# The dark theme is foot's built-in default (colors-dark is not overridden).
[colors-light]
foreground=1f1f1f
background=ffffff
regular0=1f1f1f
regular1=c62828
regular2=2e7d32
regular3=b26a00
regular4=1565c0
regular5=8e24aa
regular6=00838f
regular7=9e9e9e
bright0=555555
bright1=e53935
bright2=43a047
bright3=f9a825
bright4=1e88e5
bright5=ab47bc
bright6=00acc1
bright7=757575
